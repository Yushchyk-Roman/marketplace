apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-service
  template:
    metadata:
      labels:
        app: review-service
    spec:
      containers:
      - name: review-service
        image: review-service:v1
        imagePullPolicy: Never
        env:
        - name: DATABASE_URL
          value: "postgresql://postgres:postgres@postgres-service:5432/marketplace_db?schema=review-service"
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: JWT_SECRET
          value: "super_secret_marketplace_key_2026"
        - name: JWT_EXPIRATION
          value : "1d"
        - name: CATALOG_SERVICE_URL
          value: "http://catalog-service:3002"
        - name: SELLER_SERVICE_URL
          value: "http://seller-service:3001"
        ports:
        - containerPort: 3005
---
apiVersion: v1
kind: Service
metadata:
  name: review-service
spec:
  selector:
    app: review-service
  ports:
    - protocol: TCP
      port: 3005
      targetPort: 3005
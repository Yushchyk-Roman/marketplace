apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment-service
        image: payment-service:v1
        imagePullPolicy: Never
        env:
        - name: DATABASE_URL
          value: "postgresql://postgres:postgres@postgres-service:5432/marketplace_db?schema=payment-service"
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: JWT_SECRET
          value: "super_secret_marketplace_key_2026"
        - name: JWT_EXPIRATION
          value : "1d"
        - name: ORDER_SERVICE_URL
          value: "http://order-service:3003"
        - name: SELLER_SERVICE_URL
          value: "http://seller-service:3001"
        ports:
        - containerPort: 3004
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  selector:
    app: payment-service
  ports:
    - protocol: TCP
      port: 3004
      targetPort: 3004
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seller-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: seller-service
  template:
    metadata:
      labels:
        app: seller-service
    spec:
      containers:
      - name: seller-service
        image: seller-service:v1
        imagePullPolicy: Never
        env:
        - name: DATABASE_URL
          value: "postgresql://postgres:postgres@postgres-service:5432/marketplace_db?schema=seller-service"
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: JWT_SECRET
          value: "super_secret_marketplace_key_2026"
        - name: JWT_EXPIRATION
          value : "1d" 
        ports:
        - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: seller-service
spec:
  selector:
    app: seller-service
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
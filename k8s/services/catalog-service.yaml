apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
      - name: catalog-service
        image: catalog-service:v1
        imagePullPolicy: Never
        env:
        - name: DATABASE_URL
          value: "postgresql://postgres:postgres@postgres-service:5432/marketplace_db?schema=catalog-service"
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: JWT_SECRET
          value: "super_secret_marketplace_key_2026"
        - name: JWT_EXPIRATION
          value : "1d" 
        ports:
        - containerPort: 3002
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  selector:
    app: catalog-service
  ports:
    - protocol: TCP
      port: 3002
      targetPort: 3002
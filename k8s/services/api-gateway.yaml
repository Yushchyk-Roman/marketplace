apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: api-gateway:v1
        imagePullPolicy: Never
        env:
        - name: SELLER_SERVICE_URL
          value: "http://seller-service:3001"
        - name: CATALOG_SERVICE_URL
          value: "http://catalog-service:3002"
        - name: ORDER_SERVICE_URL
          value: "http://order-service:3003"
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-service:3004"
        - name: REVIEW_SERVICE_URL
          value: "http://review-service:3005"
        - name: JWT_SECRET
          value: "super_secret_marketplace_key_2026"
        - name: CLOUDINARY_CLOUD_NAME
          value: "dfgppjxij"
        - name: CLOUDINARY_API_KEY
          value: "777478354488657"
        - name: CLOUDINARY_API_SECRET
          value: "dJW3-0lrcz2eAQEdk2v5Jw4LDok"    
        - name: JWT_EXPIRATION
          value : "1d"
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30080